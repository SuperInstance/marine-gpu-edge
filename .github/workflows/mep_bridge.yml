name: MEP Bridge CPU Tests

on:
  push:
    branches: [main, production-round3-2026-07-10]
  pull_request:
    branches: [main, production-round3-2026-07-10]

jobs:
  mep-bridge-tests:
    runs-on: ubuntu-latest
    name: Build and run CPU-only MEP bridge tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile CPU-only bridge tests
        run: |
          g++ -std=c++17 -I include -I src \
            tests/test_mep_bridge.cpp src/mep_bridge.cpp \
            -o tests/test_mep_bridge

      - name: Run CPU-only bridge tests
        run: ./tests/test_mep_bridge

      # Note: this workflow intentionally does NOT build the CUDA kernels.
      # GitHub Actions' free runners do not provide a GPU or CUDA toolkit,
      # so CUDA targets remain verified only on real hardware.
